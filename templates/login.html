{% extends "base.html" %}

{% block title %}Demo Sign-In — QuaNet Vision{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2.5rem auto;">
    <div class="card" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.25rem;">
                <i class="fa-solid fa-water text-white"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800;">Academic Demo Sign-In</h1>
            <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">
                Sign in to manage sensor records and evaluate water quality predictions.
            </p>
        </div>

        <!-- Demo Credentials Helper Banner -->
        <div style="background: rgba(14, 165, 233, 0.12); border: 1px dashed rgba(14, 165, 233, 0.4); border-radius: 8px; padding: 0.85rem; font-size: 0.8rem; margin-bottom: 1.5rem;">
            <div style="color: #38bdf8; font-weight: 700; margin-bottom: 0.2rem;"><i class="fa-solid fa-key"></i> Default Local Demo Credentials:</div>
            <div>Email: <strong style="color: #ffffff;">{{ demo_email }}</strong></div>
            <div>Password: <strong style="color: #ffffff;">{{ demo_pwd }}</strong></div>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ demo_email }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" value="{{ demo_pwd }}" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Demo Console
            </button>
        </form>
    </div>
</div>
{% endblock %}
